name: Release

# Automatic PyPI release on a version tag.
#
# To cut a release:
#   1. Bump `version` in pyproject.toml on main, commit, merge.
#   2. Tag the merged commit with the SAME version (no "v" prefix), e.g.:
#        git tag 2.5 && git push origin 2.5
#   3. This workflow verifies the tag, builds, publishes to PyPI, and creates
#      a GitHub Release with auto-generated notes.
#
# Patch releases for an older line are cut the same way from a `maint/<series>.x`
# branch (e.g. maint/2.5.x -> 2.5.4). Note that the workflow GitHub runs is the
# one at the *tagged commit*, so any change here must also exist on the branch
# you are releasing from.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token secret.
# ONE-TIME SETUP (maintainer, on PyPI):
#   pypi.org -> project formkit-ninja -> Settings -> Publishing ->
#   "Add a new trusted publisher" (GitHub Actions):
#     Owner:        catalpainternational
#     Repository:   formkit-ninja
#     Workflow:     release.yml
#     Environment:  pypi
#   (For the very first publish on a brand-new project name, add it as a
#    "pending publisher" instead.)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must equal pyproject version
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="$(grep -m1 '^version' pyproject.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          echo "tag=$tag  pyproject=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag '$tag' does not match pyproject version '$ver'. Bump pyproject.toml to match the tag."
            exit 1
          fi
      - name: Tagged commit must be on main or a maintenance branch
        run: |
          # Patch releases for an older line are cut from `maint/<major>.<minor>.x`
          # (e.g. maint/2.5.x for 2.5.4) — those commits are deliberately not
          # ancestors of main, so accept either.
          #
          # The refspec is version-shaped on purpose: this check is what stands
          # between a pushed tag and a PyPI publish, so it must not widen to
          # "any branch called maint/<anything>". Keep `maint/*.*.x` under the
          # same branch protection as main. The `pypi` deployment environment's
          # required reviewers are the real backstop.
          #
          # No --depth here: checkout above uses fetch-depth: 0, and a shallow
          # fetch onto a full clone makes `merge-base --is-ancestor` fail
          # spuriously once a maint branch is cut from an older tag.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' || true
          git fetch --no-tags origin '+refs/heads/maint/*:refs/remotes/origin/maint/*' || true
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main refs/remotes/origin/maint); do
            # A refspec only takes one `*`, so the fetch above is broad; the
            # shape check is here. Anchored, and `*` in a glob would match `/`,
            # so this is a regex: maint/attack/9.9.x must not pass.
            case "$ref" in
              refs/remotes/origin/main) ;;
              *) echo "$ref" | grep -Eq '^refs/remotes/origin/maint/[0-9]+\.[0-9]+\.x$' || continue ;;
            esac
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
              echo "Tagged commit is on ${ref#refs/remotes/}"
              exit 0
            fi
          done
          echo "::error::Tagged commit $GITHUB_SHA is not on main or a maint/<major>.<minor>.x branch. Release only from a merged, CI-green branch."
          exit 1

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/formkit-ninja/
    permissions:
      id-token: write # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
