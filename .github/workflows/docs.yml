name: ci 
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install uv
        # setup-uv publishes no floating major tag past v7 (which is now well
        # behind), so this one is pinned to an exact release, unlike the rest.
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: uv pip install --system mkdocs-material mkdocstrings[python]
      - run: mkdocs gh-deploy --force
